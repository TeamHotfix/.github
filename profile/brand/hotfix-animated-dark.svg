<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -70 3134 1085" role="img" aria-label="hotfix"><title>hotfix</title><style>
.burn{transform:translateX(0);animation:burn 1.15s cubic-bezier(.55,.05,.35,1) .25s both}
.seep{transform:translateY(0);animation:seep .8s cubic-bezier(.4,0,.3,1) 1.15s both}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:ignite .55s cubic-bezier(.2,.9,.3,1.25) 1.4s both,
  flicker 1.9s ease-in-out 2s infinite}
@keyframes burn{from{transform:translateX(-1548px)}to{transform:translateX(0)}}
@keyframes seep{from{transform:translateY(-1081px)}to{transform:translateY(0)}}
@keyframes ignite{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flicker{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.975,1.035) rotate(-1.2deg)}
  60%{transform:scale(1.02,.985) rotate(.8deg)}80%{transform:scale(.99,1.02) rotate(-.4deg)}}
@media (prefers-reduced-motion:reduce){.burn,.seep,.flame{animation:none}}
